spring.application.name=demo
client.id=ccloud-springboot-client-c084382d-d56a-4cac-883a-72aeca1cec63

# ==========================================
# 1. PostgreSQL & HikariCP Pool Tuning
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgresadmin}
spring.datasource.password=${DB_PASSWORD:}
# Force PostgreSQL to bundle separate insert strings into optimized batch packets
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:property_db}?reWriteBatchedInserts=true

# Cap connection pool size at 20 per pod (4 pods x 20 = 80 total cluster database connections)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# Tell Hibernate to process SQL inserts in chunks
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.hibernate.ddl-auto=update
# Highly recommended: Disable show-sql for production load tests to prevent logging disk I/O bottlenecks
spring.jpa.show-sql=false

# ==========================================
# 2. Redis & Lettuce Driver Tuning
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Lettuce Driver Connection Pool Adjustments for High Concurrent Load
spring.data.redis.lettuce.pool.max-active=64
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.command-timeout=1500ms
# Force the use of SSL/TLS to match AWS forced In-Transit Encryption
spring.data.redis.ssl.enabled=true

# ==========================================
# 3. Apache Kafka Batch Consumer Setup
# ==========================================
spring.kafka.bootstrap-servers=pkc-921jm.us-east-2.aws.confluent.cloud:9092
spring.kafka.property-topic=properties-lifecycle
spring.kafka.consumer.group-id=property-ingestion-group
spring.kafka.consumer.auto-offset-reset=latest

# Key and Value Deserializer Settings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust package paths for JSON Mapping
spring.kafka.consumer.properties.spring.json.trusted.packages=com.propapp.model,java.util,java.lang

# Core Batch Engine Adjustments (Sustains 500 msg/s via chunks of 50)
spring.kafka.listener.type=batch
spring.kafka.consumer.max-poll-records=50
spring.kafka.listener.container-factory.kafkaListenerContainerFactory.consumer.max-poll-records=50

# Strict manual ack mode to guarantee zero data loss on database failures
spring.kafka.listener.ack-mode=manual_immediate

# Confluent Cloud Security Credentials
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='{{ CLUSTER_API_KEY }}' password='{{ CLUSTER_API_SECRET }}';

# Kafka Optimization Tuning Under Load
spring.kafka.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.max.partition.fetch.bytes=262144
spring.kafka.consumer.properties.fetch.max.bytes=2097152
spring.kafka.listener.container-factory.kafkaListenerContainerFactory.consumer.properties.max.partition.fetch.bytes=262144
spring.kafka.listener.container-factory.kafkaListenerContainerFactory.consumer.properties.fetch.max.bytes=1048576

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=always

