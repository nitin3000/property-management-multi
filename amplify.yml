version: 1
applications:
  # 🅰️ APPLICATION 1: YOUR ANGULAR APP
  - appRoot: ui/angular/mls-nexus-frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.22.3
            - nvm use 22.22.3
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/mls-nexus-frontend/browser # Double check this matches your folder inside dist/
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  # ⚛️ APPLICATION 2: YOUR REACT APP
  - appRoot: ui/property-search-ui
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci 
        build:
          commands:
            - export VITE_API_URL=https://67xxb63cxb.execute-api.us-east-2.amazonaws.com && npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
