version: 1
applications:
  - appRoot: ui/angular/mls-nexus-frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.22.3
            - nvm use 22.22.3
            - npm ci
        build:
          commands:
            - npm run build -- --configuration=production
      artifacts:
        baseDirectory: dist/mls-nexus-frontend/browser
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
