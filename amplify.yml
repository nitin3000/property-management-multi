version: 1
applications: # 👈 1. ADDED: This wrapper block tells Amplify it's a monorepo
  - appRoot: ui/angular/mls-nexus-frontend # 👈 2. ADDED: This points directly to your Angular project folder
    frontend: # 👈 3. MOVED: Everything below this is now neatly indented under the app root
      phases:
        preBuild:
          commands:
            - nvm install 22.22.3
            - nvm use 22.22.3
            - npm ci
        build:
          commands:
            - npm run build -- --configuration=production
      artifacts:
        baseDirectory: dist/mls-nexus-frontend/browser # 👈 4. CHANGED: Made relative to the appRoot directory
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
