version: 1
applications:
  # 🅰️ APPLICATION 1: YOUR ANGULAR APP
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/mls-nexus-frontend/browser # Verify your Angular output path
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: ui/angular/mls-nexus-frontend

  # ⚛️ APPLICATION 2: YOUR REACT APP
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist # Change to 'build' if using standard Create React App
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: ui/property-search-ui
