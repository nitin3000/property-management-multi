name: Java Build & AI Auto-Fix

on:
  push:
    branches:
      - uat-openshift

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Run the build and save all output (stdout + stderr) to a log file
    - name: Build with Maven
      id: maven_build
      run: |
        mvn clean package -DskipTests > maven_build.log 2>&1
      continue-on-error: true

    # This step only runs if the Maven build step fails
    - name: Send Failures to AI Agent
      if: steps.maven_build.outcome == 'failure'
      run: |
        echo "❌ Build failed! Forwarding logs to OpenShift AI Agent..."
        
        # Read logs and escape special characters safely for a JSON payload
        CLEAN_LOGS=$(cat maven_build.log | jq -Rs .)
        
        # Construct JSON payload matching your Agent DTO requirements
        PAYLOAD=$(jq -n \
          --arg repo "${{ github.repositoryUrl }}" \
          --arg branch "${{ github.ref_name }}" \
          --arg logs "$CLEAN_LOGS" \
          '{repoUrl: $repo, branch: $branch, rawBuildLogs: $logs}')

        # Send the payload via curl to your OpenShift public route
        curl -X POST \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "${{ secrets.AI_AGENT_ROUTE_URL }}/api/listings"
