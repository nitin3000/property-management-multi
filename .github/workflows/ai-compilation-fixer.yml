name: Java Build & AI Auto-Fix

#on:
 # push:
  #  branches:
  #    - uat-openshift
  #workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Run the build and save all output (stdout + stderr) to a log file
    - name: Build with Maven
      id: maven_build
      run: |
        set -o pipefail
        mvn -f java/pom.xml clean package -DskipTests 2>&1 | tee maven_build.log || echo "FAILED" > build_status.txt
      continue-on-error: true
# This step only runs if the Maven build step fails
    - name: Send Failures to AI Agent
      if: always()
      run: |
        if [ ! -f build_status.txt ]; then
          echo "✅ Build passed. Skipping agent notification."
          exit 0
        fi

        echo "❌ Build failed! Forwarding logs to OpenShift AI Agent..."
        
        # Construct the JSON directly into a file to avoid command argument length limits
        jq -n \
          --arg action "opened" \
          --argjson issue_num ${{ github.run_number }} \
          --arg title "Compilation Failure in Build #${{ github.run_number }}" \
          --arg body "The Maven compilation pipeline failed on branch ${{ github.ref_name }}." \
          --arg full_name "${{ github.repository }}" \
          --arg clone_url "https://github.com/${{ github.repository }}.git" \
          --arg branch "${{ github.ref_name }}" \
          '{
            action: $action,
            issue: {
              number: $issue_num,
              title: $title,
              body: $body
            },
            repository: {
              full_name: $full_name,
              clone_url: $clone_url,
              default_branch: $branch
            }
          }' > payload.json

        # Send the payload to the exact same webhook URL
        curl -X POST \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: issues" \
          -d @payload.json \
          "${{ secrets.AI_AGENT_ROUTE_URL }}/api/webhooks/github"
